name: Sync Upstream Frontend

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
    - cron: '53 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-frontend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel

    steps:
      - name: Install tooling
        run: |
          set -euo pipefail
          # Refresh the keyring first: stale images fail signature checks.
          for attempt in 1 2 3; do
            if pacman -Sy --noconfirm --needed archlinux-keyring; then
              break
            fi
            echo "keyring refresh failed (attempt ${attempt}/3)"
            sleep $((attempt * 15))
          done
          pacman -Su --noconfirm --needed curl git perl

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure release bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, and push when upstream changed
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            # Start every attempt from the current tip so a concurrently
            # advanced main never wedges this workflow.
            git fetch origin main
            git reset --hard origin/main

            ./scripts/bump-codex-frontend.sh --latest

            if git diff --quiet --exit-code; then
              echo "No upstream frontend change detected."
              exit 0
            fi

            version="$(sed -n 's/^_codex_frontend_version=//p' packaging/aur/PKGBUILD)"
            git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
            git commit -m "Bump frontend bundle to ${version}"

            if git push origin HEAD:main; then
              echo "Pushed frontend bump ${version}."
              exit 0
            fi

            git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO packaging/aur-bin/PKGBUILD packaging/aur-bin/.SRCINFO
            sleep 15
          done

          echo "Failed to push frontend bump after 3 attempts." >&2
          exit 1
