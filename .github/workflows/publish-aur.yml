name: Publish AUR Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/aur/**'
      - 'packaging/aur-bin/**'
      - 'scripts/sync-aur-repo.sh'
      - 'scripts/sync-aur-bin-repo.sh'
      - '.github/workflows/publish-aur.yml'
  workflow_run:
    workflows:
      - Sync Upstream Frontend
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: publish-aur-package
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      asset_sha256: ${{ steps.release.outputs.asset_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install tooling
        run: |
          set -euo pipefail
          # Refresh the keyring first: stale images fail signature checks.
          for attempt in 1 2 3; do
            if pacman -Sy --noconfirm --needed archlinux-keyring; then
              break
            fi
            echo "keyring refresh failed (attempt ${attempt}/3)"
            sleep $((attempt * 15))
          done
          pacman -Su --noconfirm --needed git rust pkgconf gtk3 webkit2gtk-4.1 libsoup3 openssl github-cli curl

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history: the release tag derives from the total commit count
          # and must grow monotonically across releases.
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and attach release binary when missing
        id: release
        run: |
          set -euo pipefail
          tag="r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          asset_name="codex-native-${tag}-linux-x86_64.tar.gz"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset_name}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${tag} already exists; reusing."
            digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq ".assets[] | select(.name == \"${asset_name}\") | .digest" || true)"
            if [[ "$digest" != sha256:* ]]; then
              echo "digest unavailable from API; hashing asset directly"
              digest="sha256:$(curl -fsSL "$asset_url" | sha256sum | awk '{print $1}')"
            fi
            {
              echo "tag=${tag}"
              echo "asset_sha256=${digest#sha256:}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Building release ${tag}."
          cargo build --release -p codex-native

          stage="$(mktemp -d)"
          cp target/release/codex-native "$stage/codex-native"
          cp LICENSE "$stage/LICENSE"
          tar -czf "$asset_name" -C "$stage" codex-native LICENSE
          asset_sha256="$(sha256sum "$asset_name" | awk '{print $1}')"

          gh release create "$tag" "$asset_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "codex-native ${tag}" \
            --notes "Prebuilt x86_64 binary consumed by the codex-native-bin AUR package."

          {
            echo "tag=${tag}"
            echo "asset_sha256=${asset_sha256}"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: build-release
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base-devel

    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
      RELEASE_ASSET_SHA256: ${{ needs.build-release.outputs.asset_sha256 }}

    steps:
      - name: Check AUR secret availability
        id: aur_secret
        run: |
          if [[ -n "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping publish."
          fi

      - name: Install tooling
        if: steps.aur_secret.outputs.present == 'true'
        run: |
          set -euo pipefail
          # Refresh the keyring first: stale images fail signature checks.
          for attempt in 1 2 3; do
            if pacman -Sy --noconfirm --needed archlinux-keyring; then
              break
            fi
            echo "keyring refresh failed (attempt ${attempt}/3)"
            sleep $((attempt * 15))
          done
          pacman -Su --noconfirm --needed git openssh perl

      - name: Check out repository
        if: steps.aur_secret.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Mark workspace safe for git
        if: steps.aur_secret.outputs.present == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure SSH for AUR
        if: steps.aur_secret.outputs.present == 'true'
        run: |
          set -euo pipefail
          ssh_dir="/root/.ssh"
          install -dm700 "${ssh_dir}"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${ssh_dir}/aur"
          chmod 600 "${ssh_dir}/aur"

          known_hosts="${ssh_dir}/known_hosts"
          rm -f "${known_hosts}"
          for attempt in 1 2 3; do
            if ssh-keyscan -H aur.archlinux.org > "${known_hosts}" 2>/dev/null && [[ -s "${known_hosts}" ]]; then
              break
            fi
            echo "ssh-keyscan failed (attempt ${attempt}/3)"
            sleep $((attempt * 10))
          done
          if [[ ! -s "${known_hosts}" ]]; then
            echo "could not reach aur.archlinux.org" >&2
            exit 1
          fi

          cat > "${ssh_dir}/config" <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile /root/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /root/.ssh/known_hosts
          EOF
          chmod 600 "${ssh_dir}/config"

      - name: Sync source package to AUR
        if: steps.aur_secret.outputs.present == 'true'
        working-directory: /tmp
        env:
          GIT_SSH_COMMAND: ssh -F /root/.ssh/config
        run: |
          set -euo pipefail
          rm -rf aur-codex-native-git
          git clone -q "ssh://aur@aur.archlinux.org/codex-native-git.git" aur-codex-native-git
          "$GITHUB_WORKSPACE/scripts/sync-aur-repo.sh" /tmp/aur-codex-native-git
          cd aur-codex-native-git
          if git diff --quiet --exit-code; then
            echo "No AUR changes to publish for codex-native-git."
          else
            version="$(sed -n 's/^pkgver=//p' PKGBUILD)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PKGBUILD .SRCINFO codex-native.desktop codex-native-launcher README.md
            git commit -q -m "Update codex-native-git to ${version}"
            git push -q origin master
            echo "Pushed codex-native-git ${version} to AUR."
          fi

      - name: Sync binary package to AUR
        if: steps.aur_secret.outputs.present == 'true'
        working-directory: /tmp
        env:
          GIT_SSH_COMMAND: ssh -F /root/.ssh/config
        run: |
          set -euo pipefail
          rm -rf aur-codex-native-bin
          git clone -q "ssh://aur@aur.archlinux.org/codex-native-bin.git" aur-codex-native-bin \
            || { echo "codex-native-bin does not exist yet; initializing new AUR package."; git init -q -b master aur-codex-native-bin; }
          cd aur-codex-native-bin
          if ! git remote get-url origin > /dev/null 2>&1; then
            git remote add origin "ssh://aur@aur.archlinux.org/codex-native-bin.git"
          fi
          "$GITHUB_WORKSPACE/scripts/sync-aur-bin-repo.sh" /tmp/aur-codex-native-bin
          if git diff --quiet --exit-code && git rev-parse -q --verify HEAD > /dev/null; then
            echo "No AUR changes to publish for codex-native-bin."
            exit 0
          fi
          version="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO codex-native.desktop codex-native-launcher README.md
          if git rev-parse -q --verify HEAD > /dev/null; then
            git commit -q -m "Update codex-native-bin to ${version}"
          else
            git commit -q -m "Initial import of codex-native-bin at ${version}"
          fi
          git push -q origin master
          echo "Pushed codex-native-bin ${version} to AUR."
